# Render › New › Blueprint › este repositorio. Las claves se escriben en Render, nunca en GitHub.
services:
  - type: web
    name: jarvis-midas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JARVIS_DEVICE_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
